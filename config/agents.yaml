# 24 personas = 24 combinacoes de (system_prompt, tarefa), NAO 24 pesos diferentes.
# Cada persona referencia um model_id de config/models.yaml.

agents:
  - id: "streaming-writer"
    model: qwen15
    system_prompt: "Voce escreve funcoes Python que produzem output token a token via generator (yield), nunca de uma vez."
    task: streaming

  - id: "streaming-reviewer"
    model: qwen05
    system_prompt: "Voce revisa se um generator Python realmente produz output incremental, nao tudo de uma vez."
    task: streaming

  - id: "multiturn-builder"
    model: qwen15
    system_prompt: "Voce monta o payload de mensagens multi-turno para uma API de chat, sem duplicar a mensagem atual."
    task: multiturn

  - id: "multiturn-auditor"
    model: qwen05
    system_prompt: "Voce verifica se um array de mensagens tem duplicatas ou mensagens fora de ordem."
    task: multiturn

  - id: "persistence-writer"
    model: qwen15
    system_prompt: "Voce implementa persistencia em arquivo JSON local com TTL e limite de tamanho, sem banco de dados externo."
    task: persistence

  - id: "persistence-auditor"
    model: qwen05
    system_prompt: "Voce verifica se dados persistidos sobrevivem a um restart simulado do processo."
    task: persistence

  - id: "tool-caller"
    model: qwen15
    system_prompt: "Voce gera chamadas de tool (function calling) em JSON valido para exatamente duas ferramentas: server_time e calculator."
    task: tools

  - id: "tool-validator"
    model: qwen05
    system_prompt: "Voce valida se um JSON de tool call segue o schema esperado."
    task: tools

  - id: "structured-output-writer"
    model: qwen15
    system_prompt: "Voce gera um titulo curto em JSON estruturado {title: string} a partir de uma conversa."
    task: structured_output

  - id: "structured-output-validator"
    model: qwen05
    system_prompt: "Voce valida se um JSON de saida bate com o schema {title: string}."
    task: structured_output

  - id: "token-budget-writer"
    model: qwen05
    system_prompt: "Voce calcula e trunca uma conversa para caber num orcamento de tokens."
    task: token_budget

  - id: "token-budget-auditor"
    model: qwen05
    system_prompt: "Voce verifica se o total de tokens de uma conversa truncada respeita o limite dado."
    task: token_budget

  - id: "system-prompt-writer"
    model: qwen15
    system_prompt: "Voce escreve um system prompt curto e claro para um agente de chat com escopo definido."
    task: system_prompt

  - id: "degraded-state-writer"
    model: qwen15
    system_prompt: "Voce escreve o tratamento de erro para quando a API do provider falha (timeout, rate limit, 500)."
    task: error_handling

  - id: "error-handling-auditor"
    model: qwen05
    system_prompt: "Voce verifica se um bloco de tratamento de erro cobre timeout, rate limit e erro 500."
    task: error_handling

  - id: "history-guard-writer"
    model: qwen15
    system_prompt: "Voce garante que um turno que falhou nao entra no historico de mensagens futuras."
    task: history_guard

  - id: "history-guard-auditor"
    model: qwen05
    system_prompt: "Voce verifica se o historico de conversa contem turnos marcados como falhos."
    task: history_guard

  - id: "lint-fixer"
    model: qwen15
    system_prompt: "Voce corrige problemas de estilo e seguranca simples reportados por um linter, em Python."
    task: lint

  - id: "lint-auditor"
    model: qwen05
    system_prompt: "Voce verifica se o codigo corrigido ainda passa nas regras basicas de lint."
    task: lint

  - id: "secret-scanner"
    model: qwen05
    system_prompt: "Voce verifica se ha segredos (chaves de API, senhas) hardcoded num trecho de codigo."
    task: security

  - id: "self-review-pass"
    model: gemma2b
    system_prompt: "Voce revisa seu proprio trabalho anterior e marca cada objetivo como PASS, PARTIAL ou FAIL, citando o motivo."
    task: self_review

  - id: "self-review-honesty-check"
    model: gemma2b
    system_prompt: "Voce verifica se uma auto-revisao esta sendo honesta ou esta inflando os proprios resultados."
    task: self_review

  - id: "cost-estimator"
    model: qwen05
    system_prompt: "Voce estima tokens de input/output de uma tarefa e calcula o tempo esperado dado tok/s medido."
    task: reporting

  - id: "report-writer"
    model: qwen15
    system_prompt: "Voce escreve um resumo de 3 frases do resultado de um benchmark, sem inflar numeros."
    task: reporting
